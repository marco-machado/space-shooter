<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Space Shooter Game" />
  <meta name="keywords" content="game, space, shooter, phaser, javascript" />
  <title>Space Shooter Game</title>
  <style>
      /* Game container styles */
      body {
          margin: 0;
          padding: 0;
          background: #000;
          color: #fff;
          font-family: 'Arial', sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          overflow: hidden;
      }

      #app {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100vh;
      }

      #game-container {
          position: relative;
          border: 2px solid #333;
          border-radius: 8px;
          box-shadow: 0 0 20px rgba(0, 153, 255, 0.3);
          background: #000011;
      }


      /* Error message styles */
      .error-message {
          background: #1a1a1a;
          color: #ff4444;
          padding: 20px;
          border-radius: 8px;
          border: 2px solid #ff4444;
          text-align: center;
          font-family: monospace;
          max-width: 400px;
          margin: 20px;
      }

      /* Mobile responsiveness */
      @media (max-width: 900px) {
          #game-container {
              border: none;
              border-radius: 0;
              width: 100vw;
              height: 100vh;
          }

      }

      /* Development mode indicator */
      .dev-indicator {
          position: fixed;
          top: 10px;
          left: 10px;
          background: rgba(255, 255, 0, 0.8);
          color: #000;
          padding: 5px 10px;
          border-radius: 4px;
          font-size: 12px;
          font-weight: bold;
          z-index: 10000;
      }

      /* Performance stats */
      .perf-stats {
          position: fixed;
          top: 10px;
          right: 10px;
          background: rgba(0, 0, 0, 0.7);
          color: #00ff00;
          padding: 5px 10px;
          border-radius: 4px;
          font-family: monospace;
          font-size: 11px;
          z-index: 10000;
      }
  </style>
</head>
<body>
<div id="app">
  <div id="game-container">
  </div>
</div>

<!-- Main game script -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
