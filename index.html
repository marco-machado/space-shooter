<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Space Shooter - Defend the Galaxy" />
    <meta name="keywords" content="game, space, shooter, phaser, javascript" />
    <title>Space Shooter - Defend the Galaxy</title>
    <style>
      /* Game container styles */
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: 'Arial', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
      }

      #game-container {
        position: relative;
        border: 2px solid #333;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 153, 255, 0.3);
        background: #000011;
      }

      /* Loading screen styles */
      #loading-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000011;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-title {
        font-size: 3rem;
        color: #0099ff;
        margin-bottom: 2rem;
        text-shadow: 0 0 10px rgba(0, 153, 255, 0.5);
        animation: pulse 2s infinite;
      }

      .loading-text {
        font-size: 1.2rem;
        color: #888;
        margin-bottom: 1rem;
      }

      .loading-bar {
        width: 300px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 1rem;
      }

      .loading-fill {
        height: 100%;
        background: linear-gradient(90deg, #0099ff, #00ff99);
        width: 0%;
        transition: width 0.3s ease;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }

      /* Error message styles */
      .error-message {
        background: #1a1a1a;
        color: #ff4444;
        padding: 20px;
        border-radius: 8px;
        border: 2px solid #ff4444;
        text-align: center;
        font-family: monospace;
        max-width: 400px;
        margin: 20px;
      }

      /* Mobile responsiveness */
      @media (max-width: 900px) {
        #game-container {
          border: none;
          border-radius: 0;
          width: 100vw;
          height: 100vh;
        }
        
        .loading-title {
          font-size: 2rem;
        }
        
        .loading-bar {
          width: 250px;
        }
      }

      /* Development mode indicator */
      .dev-indicator {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(255, 255, 0, 0.8);
        color: #000;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        z-index: 10000;
      }

      /* Performance stats */
      .perf-stats {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: #00ff00;
        padding: 5px 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container">
        <!-- Loading screen -->
        <div id="loading-screen">
          <div class="loading-title">SPACE SHOOTER</div>
          <div class="loading-text">Initializing game systems...</div>
          <div class="loading-bar">
            <div class="loading-fill" id="loading-fill"></div>
          </div>
          <div class="loading-text" id="loading-status">Starting up...</div>
        </div>
      </div>

      <!-- Development mode indicator -->
      <div id="dev-indicator" class="dev-indicator" style="display: none;">
        DEVELOPMENT MODE
      </div>

      <!-- Performance stats (debug mode) -->
      <div id="perf-stats" class="perf-stats" style="display: none;">
        <div>FPS: <span id="fps">--</span></div>
        <div>Memory: <span id="memory">--</span>MB</div>
      </div>
    </div>

    <!-- Game initialization script -->
    <script>
      // Simple loading screen management
      let loadingProgress = 0;
      const loadingFill = document.getElementById('loading-fill');
      const loadingStatus = document.getElementById('loading-status');
      const loadingScreen = document.getElementById('loading-screen');

      // Simulate loading progress
      const updateLoading = (progress, status) => {
        loadingProgress = Math.max(loadingProgress, progress);
        loadingFill.style.width = loadingProgress + '%';
        if (status) loadingStatus.textContent = status;
      };

      // Show development indicator based on environment
      const urlParams = new URLSearchParams(window.location.search);
      const isDev = urlParams.get('dev') === 'true' || window.location.hostname === 'localhost';
      
      if (isDev) {
        document.getElementById('dev-indicator').style.display = 'block';
        document.getElementById('perf-stats').style.display = 'block';
        
        // Simple performance monitoring
        setInterval(() => {
          const fps = Math.round(1000 / (performance.now() - (window.lastFrameTime || performance.now())));
          window.lastFrameTime = performance.now();
          document.getElementById('fps').textContent = isFinite(fps) ? fps : '--';
          
          if (performance.memory) {
            const memory = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
            document.getElementById('memory').textContent = memory;
          }
        }, 1000);
      }

      // Hide loading screen when game is ready
      const hideLoadingScreen = () => {
        updateLoading(100, 'Game ready!');
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }, 500);
      };

      // Listen for game ready event
      window.addEventListener('gameReady', hideLoadingScreen);

      // Progressive loading updates
      updateLoading(10, 'Loading environment configuration...');
      setTimeout(() => updateLoading(30, 'Initializing Phaser engine...'), 100);
      setTimeout(() => updateLoading(50, 'Setting up game scenes...'), 200);
      setTimeout(() => updateLoading(70, 'Loading development graphics...'), 300);
      setTimeout(() => updateLoading(90, 'Finalizing setup...'), 400);

      // Fallback: hide loading screen after timeout
      setTimeout(() => {
        if (!loadingScreen.classList.contains('hidden')) {
          console.warn('Loading screen timeout - hiding automatically');
          hideLoadingScreen();
        }
      }, 5000);

      // Error handling for loading failures
      window.addEventListener('error', (event) => {
        loadingStatus.textContent = 'Error loading game';
        loadingStatus.style.color = '#ff4444';
      });
    </script>

    <!-- Main game script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
